<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Algebra – Lesson 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:Inter, sans-serif; background:#050816; color:#f9fafb; }
    .container { max-width:900px; margin:40px auto; padding:0 20px; }
    h1 { font-size:32px; margin-bottom:8px; }
    .question { background:#0f172a; padding:16px; border-radius:12px; margin-top:12px; }
    input { padding:8px; border-radius:6px; border:none; width:140px; }
    button { padding:8px 14px; border:none; border-radius:6px; margin-left:8px; cursor:pointer; }
    .correct { color:#22c55e; font-weight:600; }
    .wrong { color:#ef4444; font-weight:600; }
    .nav { margin-top:24px; }
    .nav a { color:#22c55e; margin-right:16px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lesson 3: Solving 2‑Step Equations</h1>
    <p>Undo addition/subtraction first, then undo multiplication/division.</p>

    <div class="question">
      <p><strong>Q1:</strong> Solve: 2x + 3 = 15</p>
      <input id="q1" placeholder="Answer">
      <button onclick="check1()">Check</button>
      <p id="a1"></p>
    </div>

    <div class="question">
      <p><strong>Q2:</strong> Solve: 4x − 5 = 11</p>
      <input id="q2" placeholder="Answer">
      <button onclick="check2()">Check</button>
      <p id="a2"></p>
    </div>

    <div class="question">
      <p><strong>Q3:</strong> Solve: 3x + 9 = 0</p>
      <input id="q3" placeholder="Answer">
      <button onclick="check3()">Check</button>
      <p id="a3"></p>
    </div>

    <div class="nav">
      <a href="algebra-lesson2.html">← Previous</a>
      <a href="algebra-lesson4.html">Next lesson →</a>
    </div>
  </div>

<script>
function check1(){
  const v = q1.value.trim();
  a1.textContent = (v === "6") ? "Correct!" : "Try again.";
  a1.className = (v === "6") ? "correct" : "wrong";
}
function check2(){
  const v = q2.value.trim();
  a2.textContent = (v === "4") ? "Correct!" : "Try again.";
  a2.className = (v === "4") ? "correct" : "wrong";
}
function check3(){
  const v = q3.value.trim();
  const ok = (v === "−3" || v === "‑3" || v === "-3");
  a3.textContent = ok ? "Correct!" : "Try again.";
  a3.className = ok ? "correct" : "wrong";
}
</script>
</body>
</html>
