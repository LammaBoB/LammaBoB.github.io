<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Algebra – Lesson 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:Inter, sans-serif; background:#050816; color:#f9fafb; }
    .container { max-width:900px; margin:40px auto; padding:0 20px; }
    h1 { font-size:32px; margin-bottom:8px; }
    h2 { margin-top:24px; }
    .question { background:#0f172a; padding:16px; border-radius:12px; margin-top:12px; }
    input { padding:8px; border-radius:6px; border:none; width:140px; }
    button { padding:8px 14px; border:none; border-radius:6px; margin-left:8px; cursor:pointer; }
    .correct { color:#22c55e; font-weight:600; }
    .wrong { color:#ef4444; font-weight:600; }
    .nav { margin-top:24px; }
    .nav a { color:#22c55e; margin-right:16px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lesson 1: Simplifying Expressions</h1>
    <p>Combine like terms and use basic exponent rules.</p>

    <div class="question">
      <p><strong>Q1:</strong> Simplify: 3x + 5x</p>
      <input id="q1" placeholder="Answer">
      <button onclick="check1()">Check</button>
      <p id="a1"></p>
    </div>

    <div class="question">
      <p><strong>Q2:</strong> Simplify: x² · x³</p>
      <input id="q2" placeholder="Answer">
      <button onclick="check2()">Check</button>
      <p id="a2"></p>
    </div>

    <div class="question">
      <p><strong>Q3:</strong> Simplify: 4y + 7y − 2y</p>
      <input id="q3" placeholder="Answer">
      <button onclick="check3()">Check</button>
      <p id="a3"></p>
    </div>

    <div class="nav">
      <a href="index.html">← Back to courses</a>
      <a href="algebra-lesson2.html">Next lesson →</a>
    </div>
  </div>

<script>
function check1(){
  const v = q1.value.trim();
  a1.textContent = (v === "8x") ? "Correct! 3x + 5x = 8x." : "Try again. Combine the x terms.";
  a1.className = (v === "8x") ? "correct" : "wrong";
}
function check2(){
  const v = q2.value.trim().toLowerCase();
  const ok = (v === "x^5" || v === "x5");
  a2.textContent = ok ? "Correct! Add the powers: 2 + 3 = 5." : "Try again. Multiply same base → add powers.";
  a2.className = ok ? "correct" : "wrong";
}
function check3(){
  const v = q3.value.trim().toLowerCase();
  const ok = (v === "9y");
  a3.textContent = ok ? "Correct! 4y + 7y − 2y = 9y." : "Try again. Combine all y terms.";
  a3.className = ok ? "correct" : "wrong";
}
</script>
</body>
</html>
